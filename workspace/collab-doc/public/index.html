<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多人协作文档</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>多人协作文档</h1>
  <div class="meta">
    <span id="presence">—</span>
    <span id="status"><span id="dot"></span><span id="statusText">连接中…</span></span>
  </div>
</header>

<div id="toolbar">
  <button data-fmt="bold" title="加粗"><b>B</b></button>
  <button data-fmt="italic" title="斜体"><i>I</i></button>
  <button data-fmt="underline" title="下划线"><u>U</u></button>
  <span class="sep"></span>
  <button id="commentBtn">💬 评论选中文字</button>
  <span id="hint"></span>
</div>

<main>
  <div id="editor" contenteditable="true" spellcheck="false"></div>
  <aside>
    <section>
      <h2>评论</h2>
      <div id="newComment" class="hidden">
        <div class="nc-quote-label">锚定文字：</div>
        <div id="ncQuote"></div>
        <textarea id="ncText" rows="3" placeholder="输入评论内容…"></textarea>
        <div class="row">
          <button id="ncSubmit">添加评论</button>
          <button id="ncCancel" class="ghost">取消</button>
        </div>
      </div>
      <div id="comments"></div>
    </section>
    <section>
      <h2>修订时间线</h2>
      <div id="revs"></div>
    </section>
  </aside>
</main>

<script src="/shared/crdt.js"></script>
<script src="/app.js"></script>
</body>
</html>
